spring:
  application:
    name: baguwen-server
  # Spring Boot 不认 .env,这里显式导入(按 properties 格式解析;optional 表示没有也不报错)。
  # 两条路径覆盖不同启动目录:在 server/ 下启动 → ../.env;在项目根启动 → .env
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${BAGUWEN_DB_URL:jdbc:postgresql://localhost:15432/baguwen_rag}
    username: ${BAGUWEN_DB_USER:baguwen}
    password: ${BAGUWEN_DB_PASSWORD:baguwen_pg_2026}
    hikari:
      maximum-pool-size: 6
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  # SMTP 发信(验证码)。默认值对应 Resend;换服务商(阿里云邮件推送等)只改这几项,不改代码。
  # 是否真发由 app.mail.provider 决定:auto 时有 password 才真发。
  mail:
    host: ${BAGUWEN_SMTP_HOST:smtp.resend.com}
    port: ${BAGUWEN_SMTP_PORT:465}
    username: ${BAGUWEN_SMTP_USERNAME:resend}       # Resend 固定是 resend
    password: ${BAGUWEN_SMTP_PASSWORD:}             # Resend 的 API key(re_ 开头),只放 .env
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": true                # 465 是隐式 TLS,连上就加密;国内云服务器通常封 25 端口
      # 不设超时的话,SMTP 服务器无响应时发信线程会一直卡住
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  corpus:
    dir: ${BAGUWEN_CORPUS_DIR:../corpus}

  # ── 生成端:问答 / 批改 / 总结。随时可换厂商、模型、key,不影响已入库的向量。
  chat:
    provider: ${BAGUWEN_CHAT_PROVIDER:auto}   # auto(有 key 即真实) | openai | mock
    base-url: ${BAGUWEN_CHAT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${BAGUWEN_CHAT_API_KEY:}
    model: ${BAGUWEN_CHAT_MODEL:qwen-plus}
    request-timeout-secs: 120
    connect-timeout-secs: 15
    # 代理(可选):端点需代理才能访问时配置(如 Google Gemini 官方 API 经本机代理)。
    # 只作用于 chat;embed/rerank 走国内端点保持直连。host 留空或端口 0 = 直连
    proxy-host: ${BAGUWEN_CHAT_PROXY_HOST:}
    proxy-port: ${BAGUWEN_CHAT_PROXY_PORT:0}
    # 流式问答的首字超时:这么多秒内一个字都没出来就算失败——配了备用就切过去,没配就直接报错;
    # 出字之后中途停住这么久也会中断。thinking 模型首字慢(实测 Gemini thinking 约 20 秒),别配太小。0 = 不限
    first-token-timeout-secs: ${BAGUWEN_CHAT_FIRST_TOKEN_TIMEOUT_SECS:40}
    # ── 备用模型(可选):主模型连不上 / 超时 / 限流 / 5xx / key 失效时切过去,见 FallbackChat。
    # 不填 api-key = 没有备用,和以前一样。建议换一家厂商:同一家出故障时往往一起挂
    backup:
      base-url: ${BAGUWEN_CHAT_BACKUP_BASE_URL:https://api.deepseek.com}
      api-key: ${BAGUWEN_CHAT_BACKUP_API_KEY:}
      model: ${BAGUWEN_CHAT_BACKUP_MODEL:deepseek-flash}
      proxy-host: ${BAGUWEN_CHAT_BACKUP_PROXY_HOST:}   # 和主模型的代理各配各的,默认直连
      proxy-port: ${BAGUWEN_CHAT_BACKUP_PROXY_PORT:0}
      # 熔断:主模型连续失败 3 次后,60 秒内直接走备用,不再每次先白等主模型失败;到点再试主模型,好了就切回去
      breaker-failures: 3
      breaker-open-secs: 60

  # ── 向量端:索引与查询。换模型/维度后**必须重新索引**(见 GET /api/meta 的 index 字段)。
  embed:
    provider: ${BAGUWEN_EMBED_PROVIDER:auto}  # auto | openai | mock
    base-url: ${BAGUWEN_EMBED_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${BAGUWEN_EMBED_API_KEY:}
    model: ${BAGUWEN_EMBED_MODEL:BAAI/bge-m3}
    dims: ${BAGUWEN_EMBED_DIMS:1024}
    batch-size: 16
    # 是否显式传 dimensions。默认 false:硅基流动 bge-m3 传了会 400;百炼 v3/v4 需要指定维度时再开。
    send-dimensions: ${BAGUWEN_EMBED_SEND_DIMENSIONS:false}
    request-timeout-secs: 60
    connect-timeout-secs: 15

  retrieval:
    # 检索漏斗的三个 K,从宽到窄:vector-k → candidate-k(在 app.rerank 下)→ top-n
    #   vector-k   每路向量召回条数(打到 pgvector 的 LIMIT,题目级/子段级各取这么多)
    #   candidate-k 合并去重后送进 cross-encoder 重排的候选数,默认 20
    #   top-n      重排后最终进 prompt 的材料数
    # 必须 top-n < candidate-k,否则重排只是给固定几条换顺序,捞不回排名靠后的正确答案。
    # 对照主流命名:vector-k ≈ similarity_top_k / search_kwargs.k;top-n ≈ reranker 的 top_n。
    # (早期版本把 top-n 命名为 top-k,与行业惯例相反,已更正。)
    vector-k: ${BAGUWEN_RETRIEVAL_VECTOR_K:10}
    top-n: ${BAGUWEN_RETRIEVAL_TOP_N:5}
    # 拼进 prompt 的上下文预算(字符),防超长。top-n 调大时每篇材料分到的字数会等比变少。
    context-char-budget: 8000
    # 拒答双门槛(向量余弦与重排分同时过低才拒;由 golden 评测的 pos/neg 分数区间定标):
    # 实测正样本 cos 最低 0.549/重排分最低 0.0255,纯域外负样本重排分 <0.008、语义沾边 <0.061;
    # 0.55+0.02 拦住全部"纯域外"(6/10,含语义沾边的 4 条放行给 LLM 兜底),正样本误拒趋近 0。
    min-vector-sim: ${BAGUWEN_RETRIEVAL_MIN_SIM:0.55}
    min-rerank-score: ${BAGUWEN_RETRIEVAL_MIN_RERANK:0.02}

  # ── 重排端:cross-encoder 统一多粒度召回的排序(题目级/子段级余弦分不可比)。
  # key 缺省复用向量端的硅基流动 key;bge-reranker-v2-m3 免费。
  rerank:
    provider: ${BAGUWEN_RERANK_PROVIDER:auto}   # auto(有 key 即真实) | openai | mock
    base-url: ${BAGUWEN_RERANK_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${BAGUWEN_RERANK_API_KEY:${BAGUWEN_EMBED_API_KEY:}}
    model: ${BAGUWEN_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    candidate-k: 20                             # 送入重排的候选数
    request-timeout-secs: 15
    connect-timeout-secs: 10

  # ── 账号与验证码 ──
  auth:
    # HS256 签名密钥,至少 32 字节(base64 编码)。生成:openssl rand -base64 32
    # 留空时启动会随机生成一个并打 WARN——能跑,但每次重启所有 token 都会失效,只适合本地开发
    jwt-secret: ${BAGUWEN_JWT_SECRET:}
    token-ttl-hours: ${BAGUWEN_TOKEN_TTL_HOURS:168}   # 7 天
    code-ttl-minutes: 10
    code-max-attempts: 5
    code-cooldown-secs: 60

  # ── 发信 ── SMTP 服务器与账号在上面的 spring.mail
  mail:
    provider: ${BAGUWEN_MAIL_PROVIDER:auto}   # auto(配了 SMTP 密码即真实发) | smtp | mock(验证码打到日志)
    from: ${BAGUWEN_MAIL_FROM:}               # 只填地址,如 noreply@example.com;必须属于 Resend 里验证过的域名
    from-name: 面试陪练                        # 收件箱里显示的发件人名。写在这里而不是 .env:.env 里的中文会乱码

  # ── 每日额度:调大模型的接口(问答 / 批改 / 总结)每天最多多少次,控成本。0 = 不限 ──
  # 和 nginx 分工:nginx 每个 IP 每分钟 5 次(web/nginx.conf.template),防短时间狂刷;这里给每天的花费封顶。
  # 计数在内存里,每天 0 点归零,重启也会清零
  quota:
    guest-daily: ${BAGUWEN_QUOTA_GUEST_DAILY:300}   # 所有游客合用这一个额度
    user-daily: ${BAGUWEN_QUOTA_USER_DAILY:100}     # 每个登录用户各自这么多
logging:
  file:
    name: ../logs/server.log
  charset:
    file: UTF-8
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7 # 保留 7 个归档
      file-name-pattern: ../logs/server.%d{yyyy-MM-dd}.%i.log
