name: baguwen-rag

# 只跑数据库;后端/前端本机跑,便于断点调试。命名全带 baguwen 前缀,避免与其它项目(counseling 等)撞车。
services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: baguwen-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: baguwen_rag
      POSTGRES_USER: baguwen
      POSTGRES_PASSWORD: ${BAGUWEN_PG_PASSWORD:-baguwen_pg_2026}
    ports:
      - "15432:5432"          # 避开 counseling-mysql 33306 / redis 16379
    volumes:
      - baguwen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baguwen -d baguwen_rag"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  baguwen_pgdata:
